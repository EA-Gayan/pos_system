<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./src/assets/images/logo-modified.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jayanthi Hotel</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Default: dark.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
